*/
:root{color-scheme:light dark;--sky:light-dark(#86ccff,#0d1433);--sky2:light-dark(#d4efff,#1b2550);--ui:light-dark(#c6c6c6,#3a3f50);--hi:light-dark(#ffffff,#5c6378);--lo:light-dark(#555555,#1c1f2b);--ink:light-dark(#1a1a1a,#f2f2f2);--mute:light-dark(#3f3f3f,#b9bfd0);--slot:light-dark(#8b8b8b,#262a38);--good:#4caf3a;--bad:#d9412b;--warm:light-dark(#b85f00,#ffb238)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,var(--sky),var(--sky2) 75%) fixed;color:var(--ink);font:500 18px/1.55 Lexend,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(86px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
h1,h2,h3,.px,button,.pill{font-family:Lexend,system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
button{font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffde3b;outline-offset:3px}
svg{shape-rendering:crispEdges}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(3vw,12px) 24px}
.bevel{background:var(--ui);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo),0 0 0 3px #111}
.note{font-size:16px;line-height:1.5;color:var(--mute);font-weight:500;margin:6px 0}
/* top + tabs */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px max(3vw,12px);background:color-mix(in srgb,var(--sky) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:8px;font-family:Pixel,Lexend,sans-serif;white-space:nowrap;font-weight:700;font-size:24px;margin-right:auto;letter-spacing:.5px}
.logo svg{width:28px;height:35px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;font-weight:700;font-size:18px;white-space:nowrap}
.pill svg{width:20px;height:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));background:#3a2a1a;box-shadow:0 -3px 0 #111}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 2px;min-height:58px;font-size:13px;font-weight:700;color:#fff8ec}
.tab svg{width:28px;height:28px}
.tab[aria-current=true]{background:#6b4a24;box-shadow:inset 2px 2px 0 #a8743c,inset -2px -2px 0 #2a1a0a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 18px;font-weight:700;font-size:19px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);background:#7d7d7d;box-shadow:inset 3px 3px 0 #b3b3b3,inset -3px -3px 0 #444,0 0 0 3px #111}
.btn:active{box-shadow:inset 3px 3px 0 #444,inset -3px -3px 0 #b3b3b3,0 0 0 3px #111}
.btn.green{background:#4caf3a;box-shadow:inset 3px 3px 0 #82df63,inset -3px -3px 0 #2a6b1e,0 0 0 3px #111}
.btn.wood{background:#a67a3f;box-shadow:inset 3px 3px 0 #cfa05e,inset -3px -3px 0 #67461f,0 0 0 3px #111}
.btn.red{background:#c0392b;box-shadow:inset 3px 3px 0 #ea6a5a,inset -3px -3px 0 #6d1a12,0 0 0 3px #111}
.btn.sm{min-height:44px;font-size:17px;padding:4px 12px}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.btn.pulse{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
/* hero card */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:20px 22px;margin:16px 0 18px}
.hero .me{width:84px;height:105px}
.hero h1{font-size:clamp(28px,5vw,42px)}
.hero p{margin:8px 0 12px;font-weight:500;line-height:1.5;color:var(--mute)}
.xp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:Lexend;font-weight:700}
.xpbar{flex:1 1 160px;height:20px;background:var(--slot);box-shadow:inset 2px 2px 0 var(--lo),0 0 0 2px #111}
.xpbar b{display:block;height:100%;background:repeating-linear-gradient(90deg,#7dff4f 0 10px,#5ed43a 10px 20px);transition:width .4s}
.tag{background:#ffde3b;color:#4a3300;padding:3px 10px;box-shadow:0 0 0 2px #111}
.strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin:0 0 18px}
.strip p{flex:1 1 240px;margin:0;font-weight:800}
.pieces{display:flex;gap:6px;flex-wrap:wrap}
.pieces svg{width:30px;height:30px}
.pieces .no{opacity:.22;filter:grayscale(1)}
/* biomes */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}
.biome{position:relative;text-align:left;padding:12px 14px 14px;display:grid;gap:4px}
.biome:active{transform:translateY(2px)}
.cube{width:96px;height:auto;justify-self:center;margin:2px 0 4px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
.biome .sym{position:absolute;top:10px;right:12px;font-family:Lexend;font-weight:700;font-size:28px;color:#fff;text-shadow:2px 2px 0 #111}
.biome h3{font-size:20px;line-height:1.25}
.biome small{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-weight:600;font-size:15px;line-height:1.4;color:var(--mute)}
.biome .bb{position:absolute;top:8px;left:10px;width:40px;height:40px}
.ground{display:flex;overflow:hidden;margin-top:28px;height:48px}
.ground svg{width:48px;height:48px;flex:none}
/* modal */
.veil{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(5,10,25,.55)}
.veil.on{display:grid}
.modal{width:min(560px,100%);max-height:88dvh;overflow:auto;padding:22px}
.modal h2{font-size:30px}
.levels{display:grid;gap:10px;margin:16px 0}
.lv{display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:var(--slot);box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.lv b{display:grid;place-items:center;width:50px;height:50px;font-size:22px;color:#fff;text-shadow:2px 2px 0 #111;box-shadow:0 0 0 2px #111;overflow:hidden}
.lv b svg{width:46px;height:46px}
.lv span small{font-family:Lexend;font-weight:500;font-size:15px;color:var(--mute)}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.lv.boss{background:#5a1d1d;color:#fff}
.lv.boss span small{color:#ffd6cf}
.stars{color:#ffd21f;font-size:20px;letter-spacing:2px;white-space:nowrap;text-shadow:1px 1px 0 #111}
.stars s{color:rgba(0,0,0,.25);text-decoration:none;text-shadow:none}
/* question card */
.playhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.playhead h2{font-size:22px;margin-right:auto}
.prog{display:flex;gap:5px;margin-bottom:14px}
.prog span{flex:1;height:14px;background:var(--slot);box-shadow:0 0 0 2px #111}
.prog .ok{background:var(--good)}.prog .no{background:var(--bad)}.prog .now{background:#ffde3b}
.qcard{padding:clamp(14px,3vw,24px)}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.buddy{display:flex;align-items:center;gap:8px}
.buddy svg{width:44px;height:55px;flex:none}
.say{padding:6px 12px;font-family:Lexend;font-weight:700;font-size:18px;line-height:1.3}
.qbtns{display:flex;gap:8px}
.jump svg{animation:jump .5s steps(4)}
@keyframes jump{50%{transform:translateY(-16px)}}
.prompt{text-align:center;font-weight:700;font-size:clamp(21px,3vw,26px);line-height:1.5;margin:8px auto 12px;max-width:34ch;letter-spacing:.2px;word-spacing:2px}
.expr{display:flex;justify-content:center;align-items:center;gap:clamp(8px,2.4vw,20px);flex-wrap:wrap;font-family:Lexend;font-weight:800;font-size:clamp(44px,9vw,78px);line-height:1.15;font-variant-numeric:tabular-nums}
.expr b{color:var(--warm)}
.expr .q{display:inline-grid;place-items:center;min-width:1.25em;padding:0 .12em;background:var(--slot);color:#ffde3b;text-shadow:2px 2px 0 #111;box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.expr .q.fill{background:var(--good);color:#fff}
.vis{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px;margin:12px 0 4px}
.think{width:100%;text-align:center;font-family:Lexend;font-weight:800;font-size:24px;line-height:1.4;margin:0;color:var(--warm)}
.pile{display:flex;flex-wrap:wrap;gap:3px;max-width:330px;justify-content:center}
.bk{width:26px;height:26px;display:block}
.chest{display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;width:96px;min-height:72px;padding:8px;background:#7a4e24;box-shadow:inset 3px 3px 0 #a8743c,inset -3px -3px 0 #4a2e12,0 0 0 3px #111}
.chest .bk{width:18px;height:18px}
.chest.left{background:#5a2020;box-shadow:inset 3px 3px 0 #8a3a3a,inset -3px -3px 0 #2e0e0e,0 0 0 3px #111}
.arr{display:grid;gap:3px}
.arr .bk{width:22px;height:22px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.ans{min-height:84px;font-weight:800;font-size:clamp(32px,6.4vw,48px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums;background:#7d7d7d;box-shadow:inset 4px 4px 0 #b3b3b3,inset -4px -4px 0 #444,0 0 0 3px #111}
.ans:active{box-shadow:inset 4px 4px 0 #444,inset -4px -4px 0 #b3b3b3,0 0 0 3px #111}
.ans.ok{background:#4caf3a;box-shadow:inset 4px 4px 0 #82df63,inset -4px -4px 0 #2a6b1e,0 0 0 3px #111}
.ans.no{background:var(--bad);box-shadow:inset 4px 4px 0 #f07a64,inset -4px -4px 0 #7d1f10,0 0 0 3px #111;animation:wob .4s steps(4)}
@keyframes wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.after{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.after:empty{display:none}
.timer{padding:4px 12px;font-family:Lexend;font-weight:700;font-size:22px}
/* result */
.result{text-align:center;padding:26px 18px;margin-top:18px;position:relative;overflow:hidden}
.result h2{font-size:clamp(32px,6vw,48px)}
.result .stars{font-size:clamp(44px,10vw,64px)}
.result p{font-weight:800;font-size:20px;margin:6px 0}
.conf{position:absolute;top:-16px;width:12px;height:12px;animation:fall 2.2s steps(12) forwards}
@keyframes fall{to{transform:translateY(520px);opacity:0}}
/* boss */
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;padding:16px;margin-bottom:14px;background:linear-gradient(180deg,#2a1c3a,#4a2e24);color:#fff}
.bname{font-family:Lexend;font-weight:700;font-size:24px;text-shadow:2px 2px 0 #111}
.hp{height:20px;margin:6px 0 10px;background:#3a0d0d;box-shadow:0 0 0 2px #111}
.hp b{display:block;height:100%;background:repeating-linear-gradient(90deg,#ff4d3d 0 10px,#d9412b 10px 20px);transition:width .35s steps(6)}
.bspr svg{width:min(46vw,210px);height:auto;display:block;margin:0 auto}
.fighter{text-align:center}
.fighter svg{width:70px;height:88px}
.hearts{font-size:24px;letter-spacing:2px;color:#ff4d6d;text-shadow:1px 1px 0 #111}
.hearts s{color:#555;text-decoration:none}
.hit{animation:hit .45s steps(3)}
@keyframes hit{33%{transform:translateX(12px);filter:brightness(2.5)}66%{transform:translateX(-8px)}}
.ouch{animation:ouch .45s steps(3)}
@keyframes ouch{33%{transform:translateX(-10px);filter:hue-rotate(-40deg) brightness(1.4)}}
.dmg{position:fixed;z-index:60;font-family:Lexend;font-weight:700;font-size:36px;color:#ffde3b;text-shadow:3px 3px 0 #111;pointer-events:none;animation:rise 1s steps(8) forwards}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
/* mine */
.minehead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.minehead h2{font-size:30px;margin-right:auto}
.shaft{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:420px;margin:0 auto;padding:6px;background:#2a1a0a;box-shadow:0 0 0 3px #111}
.mc{position:relative;aspect-ratio:1;display:block;padding:0}
.mc>svg{width:100%;height:100%;display:block}
.mc.air{background:#1a1008}
.mc.air svg{width:80%;height:100%;margin:0 auto}
.mc.f1{filter:brightness(.6)}.mc.f2{filter:brightness(.4)}.mc.f3{filter:brightness(.22)}
.cur{animation:glowb 1s steps(2) infinite alternate}
@keyframes glowb{to{outline:3px solid #ffde3b;outline-offset:-3px}}
.mc.sel{outline:4px solid #ffde3b;outline-offset:-4px;animation:none}
.crack{position:absolute;inset:0;pointer-events:none}
.pips{position:absolute;left:3px;right:3px;bottom:3px;display:flex;gap:2px}
.pips i{flex:1;height:5px;background:#ffde3b;box-shadow:0 0 0 1px #111}
.pips i.gone{background:#333}
.oretag{position:absolute;top:2px;right:2px;font:700 11px Lexend;background:#111;color:#fff;padding:0 3px}
/* craft */
.mats{display:flex;flex-wrap:wrap;gap:8px;padding:12px;margin:10px 0 16px}
.mat{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;background:var(--slot);font-family:Lexend;font-weight:700;font-size:18px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.mat svg{width:28px;height:28px}
.gear{display:flex;flex-wrap:wrap;gap:16px;font-weight:800;margin-bottom:12px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.rc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:12px;align-items:start}
.rc>svg{width:64px;height:64px;background:var(--slot);padding:6px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.rc h3{font-size:19px}
.rc p{margin:2px 0 6px;font-size:14px;font-weight:800;color:var(--mute)}
.need{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.need span{display:flex;align-items:center;gap:3px;font:700 14px Lexend}
.need svg{width:18px;height:18px}
.need .short{color:var(--bad)}
.rc .btn{grid-column:1/-1}
.done{grid-column:1/-1;text-align:center;font-family:Lexend;font-weight:700;color:var(--good);font-size:18px}
/* quest */
.chap{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;padding:14px;margin-bottom:14px;align-items:center}
.chap>svg{width:90px;height:90px}
.chap h3{font-size:22px}
.chap ul{margin:6px 0 10px;padding-left:20px;font-weight:800}
.chap li.ok{color:var(--good)}
.chap.lock{opacity:.55}
.chap .btns{display:flex;gap:10px;flex-wrap:wrap}
/* base */
.world{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));padding:6px;background:linear-gradient(#9fd8ff,#d8f1ff);box-shadow:0 0 0 3px #111}
:root[data-theme=dark] .world{background:linear-gradient(#0b1230,#253264)}
.cell{aspect-ratio:1;padding:0;display:block;outline:1px dashed rgba(255,255,255,.35);outline-offset:-1px}
.cell svg{width:100%;height:100%;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;padding:12px;margin-top:8px}
.slot{display:grid;justify-items:center;gap:2px;padding:8px 4px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi);font-weight:800;font-size:13px}
.slot svg{width:44px;height:44px}
.slot.sel{outline:4px solid #ffde3b;outline-offset:-2px}
.slot.poor{opacity:.45}
.cost{display:flex;align-items:center;gap:3px;font-family:Lexend;font-weight:700;font-size:15px}
.cost svg{width:14px;height:14px}
/* parents */
.panel{padding:20px;margin-top:16px}
.panel h2{font-size:28px;margin-bottom:8px}
.panel h3{font-size:22px;margin:20px 0 8px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--lo);font-weight:800}
.set input[type=text],.set select,.gate input{font:inherit;font-size:16px;min-height:44px;padding:0 10px;border:0;background:var(--slot);color:var(--ink);box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi);max-width:190px}
.sw{appearance:none;-webkit-appearance:none;width:58px;height:32px;background:var(--slot);box-shadow:0 0 0 2px #111;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;background:#bbb}
.sw:checked{background:var(--good)}.sw:checked::after{left:30px;background:#fff}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-weight:800}
th,td{padding:8px 6px;border-bottom:2px solid var(--lo);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.heat{display:grid;grid-template-columns:42px repeat(12,30px);gap:3px;font-family:Lexend;font-weight:700;font-size:13px;width:max-content}
.heat span{display:grid;place-items:center;height:28px}
.heat i{height:28px;background:var(--slot);box-shadow:0 0 0 1px #111}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:800;margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-2px;box-shadow:0 0 0 1px #111}
.miss{display:flex;flex-wrap:wrap;gap:8px}
.miss span{background:#ffd6cf;color:#7d1f10;padding:4px 10px;font-weight:800;box-shadow:0 0 0 2px #111}
.gate{text-align:center}
.gate .big{font-family:Lexend;font-size:42px;margin:12px 0}
.howto{display:grid;gap:8px;padding-left:20px;font-weight:700}
/* theater */
.theater{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:rgba(0,0,0,.82)}
.theater.on{display:grid}
.tbox{width:min(860px,100%);max-height:100%;overflow:auto;padding:14px}
.ttitle{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ttitle h3{font-size:22px;margin-right:auto}
.screen{position:relative;aspect-ratio:16/9;max-height:56dvh;width:100%;overflow:hidden;background:linear-gradient(180deg,#5fb4f5,#bfe6ff 70%,#5cb135 70%,#5cb135 76%,#8b5a2b 76%);box-shadow:0 0 0 3px #111;display:grid;place-items:center}
.screen.cave{background:linear-gradient(180deg,#1a1430,#3a2a4a 70%,#55595f 70%)}
.vin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;width:100%;height:100%}
.vrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.vhero svg{width:clamp(48px,9vw,84px);height:auto}
.vboss svg{width:clamp(70px,16vw,150px);height:auto}
.veq{font-family:Lexend;font-weight:800;font-size:clamp(26px,5.5vw,52px);color:#fff;text-shadow:0 3px 0 #111;-webkit-text-stroke:1px #111;paint-order:stroke fill;text-align:center;line-height:1.2}
.veq.sm{font-size:clamp(18px,3.4vw,30px)}
.veq em{font-style:normal;color:#ffde3b}
.vbox{font-family:Lexend;font-weight:700;font-size:clamp(24px,5vw,46px);padding:6px 14px;background:#7d7d7d;color:#fff;text-shadow:2px 2px 0 #111;box-shadow:inset 3px 3px 0 #b3b3b3,inset -3px -3px 0 #444,0 0 0 3px #111}
.vbox.gold{background:#d9a514;box-shadow:inset 3px 3px 0 #ffe066,inset -3px -3px 0 #8a6200,0 0 0 3px #111}
.varrow{font-family:Lexend;font-weight:700;font-size:clamp(16px,3vw,26px);color:#ffde3b;text-shadow:2px 2px 0 #111}
.vchest{display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;width:clamp(56px,11vw,96px);min-height:56px;padding:6px;background:#7a4e24;box-shadow:inset 3px 3px 0 #a8743c,inset -3px -3px 0 #4a2e12,0 0 0 3px #111}
.vchest.left{background:#5a2020}
.vchest .bk{width:clamp(10px,2vw,16px);height:clamp(10px,2vw,16px)}
.vstamp{font-family:Lexend;font-weight:700;font-size:clamp(22px,4.5vw,40px);color:#fff;background:#4caf3a;padding:8px 18px;box-shadow:0 0 0 4px #111;transform:rotate(-4deg);animation:stamp .5s steps(4) both}
@keyframes stamp{from{transform:scale(3) rotate(-4deg);opacity:0}}
.vline{width:min(96%,560px);height:auto;overflow:visible}
.vline .arc{fill:none;stroke:#ffde3b;stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .35s linear forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.vline text{font:800 15px Lexend;fill:#fff;paint-order:stroke;stroke:#111;stroke-width:3px}
.glow{display:inline-block;background:#ffde3b;color:#111;text-shadow:none;padding:0 .12em;animation:gl .6s steps(2) 1s infinite alternate}
@keyframes gl{to{background:#ff8c1a}}
.zf{display:inline-block;animation:zf .8s steps(6) 1.2s forwards}
@keyframes zf{to{transform:translateY(80px) rotate(40deg);opacity:0}}
.vbar{display:grid;gap:3px;width:min(92%,520px)}
.vbar i{height:clamp(34px,7vw,56px);display:grid;place-items:center;background:#7d7d7d;color:#fff;font:700 18px Lexend;font-style:normal;box-shadow:0 0 0 2px #111}
.vbar i.on{background:#4caf3a;animation:pop .4s steps(4) both}
.cart{display:flex;gap:2px;padding:4px 6px 10px;background:#55595f;box-shadow:0 0 0 2px #111;position:relative}
.cart::after{content:"";position:absolute;left:4px;right:4px;bottom:-6px;height:8px;background:radial-gradient(circle,#111 3px,transparent 4px) left/50% 100% repeat-x}
.cart i{width:10px;height:14px;background:#e9b98a;box-shadow:0 -4px 0 #f4c430}
.cart.extra{background:#d9a514}
.cap{margin:10px 0 0;padding:14px 16px;font-weight:700;font-size:clamp(19px,2.8vw,24px);line-height:1.5;min-height:84px;letter-spacing:.2px}
.vprog{display:flex;gap:4px;margin:10px 0}
.vprog i{flex:1;height:8px;background:var(--slot);box-shadow:0 0 0 1px #111}
.vprog i.on{background:#ffde3b}
.tctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pop{animation:pop .45s steps(5) both}
@keyframes pop{from{transform:scale(0);opacity:0}}
.drop{animation:drop .35s steps(4) both}
@keyframes drop{from{transform:translateY(-50px);opacity:0}}
/* skills + path */
.skills{display:grid;gap:4px;text-align:left;margin:14px 0}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 40% 104px;gap:12px;align-items:center;padding:6px 0;font-weight:700;border-bottom:2px solid var(--lo)}
.sk small{display:block;font-weight:500;font-size:14px;color:var(--mute)}
.skb{height:18px;background:var(--slot);box-shadow:0 0 0 2px #111}
.skb b{display:block;height:100%;transition:width .5s}
.skv{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.badge{display:inline-block;padding:6px 16px;margin:8px 0;background:#d9a514;color:#fff;font-weight:800;font-size:clamp(24px,5vw,34px);text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:inset 3px 3px 0 #ffe066,inset -3px -3px 0 #8a6200,0 0 0 3px #111}
.missions{display:grid;gap:14px;margin:14px 0}
.mis{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px}
.mis>svg{width:64px;height:64px}
.mis h3{font-size:20px;line-height:1.3}
.mis p{margin:2px 0 0;font-weight:500;color:var(--mute);font-size:15px}
.mis .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mis.done{opacity:.7}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;text-align:left;margin-top:10px}
.two div{padding:12px 14px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.two b{display:block;margin-bottom:4px}
@media(max-width:600px){.sk{grid-template-columns:minmax(0,1fr) 104px}.skb{grid-column:1/-1;grid-row:2}.mis{grid-template-columns:48px minmax(0,1fr)}.mis>svg{width:48px;height:48px}.mis .btns{grid-column:1/-1;justify-content:stretch}.mis .btns .btn{flex:1}}
/* realm 2 */
.realms{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.realms .btn{flex:1 1 200px}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}
.fr>span:first-child{border-bottom:5px solid currentColor;padding:0 .12em .04em}
.ld{display:inline-flex;align-items:flex-end;gap:2px;font:800 clamp(30px,6vw,50px)/1.15 Lexend,sans-serif;font-variant-numeric:tabular-nums}
.ldd{padding:0 8px 0 0}
.ldg{display:grid;column-gap:0}
.ldg .t{min-height:1.15em;text-align:center;color:var(--warm);padding:0 .14em}
.ldg .n{border-top:4px solid var(--ink);text-align:center;padding:0 .14em}
.screen .ldg .n{border-top-color:#fff}
.ldg .n.f{border-left:4px solid var(--ink);padding-left:10px;border-top-left-radius:16px}
.ldg .n.hl{color:var(--warm)}
.screen .ld{color:#fff;text-shadow:0 3px 0 #111}.screen .ldg .n.f{border-left-color:#fff}.screen .ldg .t,.screen .ldg .n.hl{color:#ffde3b}
.tw{display:flex;gap:14px;align-items:flex-end;justify-content:center}
.twc{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;font-weight:800}
.twc .bk{width:18px;height:18px}
.screen .twc b{color:#fff;text-shadow:0 2px 0 #111;font-size:20px}
.fbw{width:110px}
/* class login */
.login{position:fixed;inset:0;z-index:85;display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 14px 24px;background:linear-gradient(180deg,var(--sky),var(--sky2))}
.login.on{display:block}
.lgin{max-width:640px;margin:0 auto;padding:22px;text-align:center}
.lgme{width:70px;height:88px}
#lgF{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#lgC{font:700 24px Lexend,sans-serif;text-transform:uppercase;letter-spacing:2px;min-height:54px;width:min(100%,280px);padding:0 14px;border:0;background:var(--slot);color:var(--ink);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi);text-align:center}
.lgnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
.lgnames .btn{justify-content:flex-start;font-size:20px}
.lgnames b{display:inline-grid;place-items:center;min-width:34px;height:34px;background:rgba(0,0,0,.25);margin-right:4px}
.lgslots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.lgslots span{display:grid;place-items:center;width:64px;height:64px;font-size:34px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.lgslots svg{width:46px;height:46px}
.lgpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:420px;margin:0 auto}
.lgpad .slot{min-height:100px}
.lgpad svg{width:56px;height:56px}
/* pause */
.brk.pz{background:linear-gradient(180deg,#1b2550,#0d1433)}
.pz .brkin .me{animation:none}
#pauseBtn{cursor:pointer;color:var(--ink)}
/* subjects */
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:0 0 14px}
.subj{display:grid;justify-items:center;gap:4px;padding:8px 4px;font-weight:700;font-size:15px;background:var(--ui);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo),0 0 0 3px #111}
.subj svg{width:30px;height:30px}
.subj.on{background:#4caf3a;color:#fff;box-shadow:inset 3px 3px 0 #82df63,inset -3px -3px 0 #2a6b1e,0 0 0 3px #111}
.passage{width:100%;max-width:640px;text-align:left;font-weight:500;font-size:clamp(17px,2.4vw,20px);line-height:1.6;padding:12px 16px;background:#fffbe8;color:#1a1a1a;box-shadow:inset 2px 2px 0 #d8cfa3,0 0 0 2px #111}
.answers.txt{grid-template-columns:minmax(0,1fr)}
.answers.txt .ans{font-size:clamp(18px,2.6vw,22px);min-height:60px;text-align:left;padding:10px 16px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
/* geography visuals */
.geobox{display:grid;place-items:center;width:100%}
.geobox .globe{width:min(280px,72vw);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.geobox .trmap{width:min(440px,92vw);height:auto;box-shadow:0 0 0 3px #111}
.geobox .compass{width:150px;height:auto}
.screen .gv{height:100%;padding:6px}
.screen .gv .geobox{height:100%}.screen .gv .geobox .globe{height:100%;width:auto}.screen .gv .geobox .compass{height:100%;width:auto}
.screen .gv .globe{width:auto;height:100%;max-width:100%}
.screen .gv .trmap{width:auto;max-width:100%;max-height:100%}
/* break */
.brk{position:fixed;inset:0;z-index:90;display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px;background:linear-gradient(180deg,#5cb135,#3d8a22)}
.brk.on{display:block}
.brkin{max-width:760px;margin:0 auto;padding:22px;text-align:center}
.brkin h2{font-size:clamp(30px,6vw,46px)}
.brkin .me{width:90px;height:112px;animation:hop 1s steps(4) infinite}
@keyframes hop{50%{transform:translateY(-22px)}}
.clock{font-family:Lexend;font-weight:700;font-size:clamp(54px,14vw,96px);line-height:1;margin:8px 0}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:16px 0;text-align:left}
.ex div{padding:12px 14px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.ex b{display:block;font-family:Lexend;font-size:21px}
.ex span{font-weight:800;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;visibility:hidden;z-index:95;padding:12px 18px;font-family:Lexend;font-weight:700;font-size:18px;max-width:92vw;text-align:center;transition:transform .25s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
@media(max-width:700px){.logo span{display:none}.hero{grid-template-columns:minmax(0,1fr)}.hero .me{justify-self:center}.tab{font-size:11px}.say{font-size:15px}.arena{grid-template-columns:minmax(0,1fr) 90px}.chap{grid-template-columns:60px minmax(0,1fr)}.chap>svg{width:60px;height:60px}}
@media(max-width:420px){.pill{font-size:15px;padding:5px 8px}.ans{min-height:70px}.bk{width:22px;height:22px}.buddy .say{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.vline .arc{stroke-dashoffset:0}}
.biome small .stars{flex:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="sprites"></defs></svg>
<header class="top">
 <div class="logo" id="logo"></div>
 <div class="pill bevel" title="Gems"><svg viewBox="0 0 7 7"><use href="#p-gem" width="7" height="7"/></svg><span id="gems">0</span></div>
 <div class="pill bevel" title="Stars"><span style="color:#ffd21f;text-shadow:1px 1px 0 #111">★</span><span id="starsTot">0</span></div>
 <div class="pill bevel" title="Time until movement break">⏱ <span id="brkLeft">60m</span></div>
 <button class="pill bevel" id="pauseBtn" title="Pause the game and rest"><b style="letter-spacing:-2px">||</b> Pause</button>
</header>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div class="veil" id="veil"><div class="modal bevel" id="modal"></div></div>
<div class="theater" id="th"></div>
<section class="brk" id="brk" aria-live="polite"></section>
<section class="brk pz" id="pz" aria-live="polite"></section>
<section class="login" id="login" aria-live="polite"></section>
<div class="toast bevel" id="toast"></div>

const SKM=Object.fromEntries([...SK1,...SK2].map(x=>[x.id,x]));
const RS=(r=S.realm||1)=>r===2?[...SK2,SKM.d4,SKM.d5,SKM.rem,SKM.story]:SK1;
const DS={d1:[2,5,10],d2:[3,4],d3:[6,7],d4:[8,9],d5:[11,12]};
const dsk=d=>Object.keys(DS).find(k=>DS[k].includes(d))||null;
function skillOf(q){const e=q.ex||{};
 if(realmOf(q.w)!==1)return q.w;
 if(q.w==='share')return 'meaning';if(q.w==='rem')return 'rem';if(q.w==='story')return 'story';if(q.w==='mult')return 'mult';if(q.w==='family')return 'family';
 if(q.w==='big')return e.k==='frac'?'frac':'bigdiv';if(e.k==='div')return dsk(e.d);return null}
const fq=(set,a,b)=>()=>{const d=pick(set),qq=R(a,b);return Object.assign(factQ(d*qq,d,'gold'),{w:'mine'})};
const gw=(w,l)=>()=>gen(w,l);
const SKG={};
for(const k in DS)SKG[k]={e:fq(DS[k],1,5),m:fq(DS[k],2,10),h:fq(DS[k],6,12)};
Object.assign(SKG,{meaning:{e:gw('share',2),m:gw('share',4),h:gw('share',5)},family:{e:gw('family',1),m:gw('family',2),h:()=>gen('family',pick([3,5]))},

 mult:{e:gw('mult',1),m:gw('mult',3),h:()=>gen('mult',pick([3,5]))}});
for(const x of SK2)SKG[x.id]={e:()=>gen(x.id,pick([1,2])),m:gw(x.id,3),h:()=>gen(x.id,pick([4,5]))};

function choicesFor(q){
 if(q.ch)return q.ch;
 if(q.remv){const [qq,r,d]=q.remv,s=new Set([q.ans]);
  for(const [a,b] of shuf([[qq,(r+1)%d],[qq+1,r],[qq-1,r],[qq,(r+d-1)%d],[qq+1,(r+1)%d],[qq-1,(r+2)%d]]))if(s.size<4&&a>=0)s.add(`${a} r ${b}`);
  return shuf([...s]);}
 if(q.mixv){const [w,r,den]=q.mixv,s=new Set([q.ans]);for(const [a,b] of shuf([[w+1,r],[w-1,r],[w,r+1],[w,r-1],[w+1,r-1],[w-1,r+1],[w+2,r]]))if(s.size<4&&a>=1&&b>=1&&b<den)s.add(mixStr(a,b,den));let k=2;while(s.size<4)s.add(mixStr(w+k++,r,den));return shuf([...s])}
 const a=q.ans,s=new Set([a]),ds=a>=100?[10,-10,100,-100,1,-1,20]:a>=20?[1,-1,10,-10,2,-2,5]:[1,-1,2,-2,3,-3,4];
 for(const d of shuf(ds))if(s.size<4&&a+d>=0)s.add(a+d);
 let k=5;while(s.size<4)s.add(a+k++);
 return shuf([...s]);
}

function drawGeo(el,g){if(!el||!g)return;if(g.kind==='globe')spinGlobe(el,g);else{el.innerHTML=geoVis(g);fitGeo(el)}}

let ac=null,primed=false;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}
 if(!primed&&'speechSynthesis' in window){primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}}
document.addEventListener('pointerdown',unlock,{passive:true});
function tone(f,d=.1,type='square',when=0,vol=.06){if(!S.sound||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+d);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
const sfx={ok(){[660,880,1320].forEach((f,i)=>tone(f,.09,'square',i*.07))},no(){tone(160,.25,'sawtooth',0,.07)},tap(){tone(520,.04)},gem(){tone(1200,.06,'square',0,.05);tone(1600,.16,'square',.06,.05)},win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.13,'square',i*.1))},place(){tone(220,.05,'triangle',0,.12)},hit(){tone(120,.12,'sawtooth',0,.1);tone(90,.15,'square',.05,.08)},brk(){[300,200,140].forEach((f,i)=>tone(f,.07,'square',i*.05,.08))}};
const spoken=t=>t.replace(/÷/g,' divided by ').replace(/×/g,' times ').replace(/−/g,' minus ').replace(/→/g,' then ').replace(/✔/g,'').replace(/(\d+)\/(\d+)/g,'$1 over $2');
function say(txt,onend,lang){
 if(!txt||!('speechSynthesis' in window)){onend&&onend(false);return}
 try{speechSynthesis.cancel();const parts=Array.isArray(txt)?txt:[[txt,lang||'en-US']],voices=speechSynthesis.getVoices();let i=0;
  const next=()=>{if(i>=parts.length){onend&&onend(true);return}const [t,lg]=parts[i++];const u=new SpeechSynthesisUtterance(lg==='en-US'?spoken(t):t);u.lang=lg;u.rate=lg==='en-US'?.95:.88;
   const v=voices.find(x=>x.lang&&x.lang.replace('_','-').toLowerCase()===lg.toLowerCase())||voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lg.slice(0,2).toLowerCase()));if(v)u.voice=v;

   sc.push({cap:`So the answer is ${ok?'YES':'NO'}. ${ok?`${n} ÷ ${m} = ${n/m}.`:`${n} ÷ ${m} = ${Math.floor(n/m)} r ${n%m}.`}`,art:vStamp(ok?'YES':'NO')},outroSc);break}
  case 'factor':{const {N,f}=e;sc=[intro(`Factors of ${N}`,'A factor divides a number with nothing left over.'),{cap:`${N} ÷ ${f} = ${N/f}, with nothing left. So ${f} is a factor!`,art:N<=48?vRow(arr(f,N/f,'leaves')):vEq(`${N} ÷ ${f} = <em>${N/f}</em>`)},{cap:`Pro tip: factors come in pairs. ${f} × ${N/f} = ${N}.`,art:vEq(`${f} × ${N/f} = <em>${N}</em>`)},outroSc];break}

  case 'lcm':{const {a,b}=e,c=lcm(a,b),A=[],B=[];for(let i=a;i<=c;i+=a)A.push(i);for(let i=b;i<=c;i+=b)B.push(i);const row=L2=>vRow(...L2.map((x,i)=>`<div class="vbox pop ${x===c?'gold':''}" style="animation-delay:${i*.4}s">${x}</div>`));
   sc=[intro(`${a} and ${b}`,'Find the first number that lives in both times tables.'),{cap:`The ${a} times table: ${A.join(', ')}.`,art:row(A)},{cap:`The ${b} times table: ${B.join(', ')}.`,art:row(B)},{cap:`The first number in both lists is ${c}!`,art:vStamp(String(c))},outroSc];break}

  case 'meanmiss':{const {m,a,b}=e,T=3*m,c=T-a-b;sc=[intro(`average ${m}`,'A missing number with an average? Work backwards!'),{cap:`An average of ${m} for 3 numbers means the total is 3 × ${m} = ${T}.`,art:vEq(`3 × ${m} = <em>${T}</em>`)},{cap:`Take away the numbers you know: ${T} − ${a} − ${b} = ${c}.`,art:vEq(`${T} − ${a} − ${b} = <em>${c}</em>`)},checkSc(`(${a} + ${b} + ${c}) ÷ 3 = ${m}`,`Check: (${a} + ${b} + ${c}) ÷ 3 = ${m}. Correct!`),outroSc];break}
  case 'equiv':{const {a,b,kk}=e;sc=[intro(`${a}/${b} = ?/${b*kk}`,'Equal fractions look different but are the same amount.'),{cap:`Here is ${a}/${b}: ${b} pieces, ${a} shaded.`,art:vFb(b,a)},{cap:`Cut every piece into ${kk}. Now there are ${b*kk} pieces and ${a*kk} shaded. Same amount!`,art:vFb(b*kk,a*kk)},{cap:`Rule: multiply the top and the bottom by the same number. ${a} × ${kk} = ${a*kk}.`,art:vEq(`${a}/${b} = <em>${a*kk}/${b*kk}</em>`)},outroSc];break}

   else{const {b,c}=e,mn=Math.min(b,c);sc=[intro(`1/${b} or 1/${c}`,'Which fraction is bigger?'),{cap:`1/${b} means one piece when ${b} people share. 1/${c} means one piece when ${c} people share.`,art:`<div style="width:min(92%,520px);display:grid;gap:10px">${vFb(b,1)}${vFb(c,1,1.4)}</div>`},{cap:`More people means smaller pieces! So 1/${mn} is bigger.`,art:vStamp(`1/${mn}`)},outroSc]}break}
  case 'mixed':{const {num,den}=e,w=Math.floor(num/den),r=num%den;sc=[intro(`${num}/${den}`,e.story?`Sharing ${num} pizzas between ${den} people.`:'A top-heavy fraction has whole things hiding inside!'),{cap:`${num}/${den} means ${num} ÷ ${den}. That's ${w} r ${r}.`,art:vEq(`${num} ÷ ${den} = ${w} r <em>${r}</em>`)},{cap:`So that's ${w} whole${w>1?'s':''} and ${r} piece${r>1?'s':''} out of ${den} left over.`,art:vRow(...Array.from({length:Math.min(w,5)},()=>`<div class="fbw">${vFb(den,den)}</div>`),`<div class="fbw">${vFb(den,r,1.2)}</div>`)},{cap:`Written as a mixed number: ${w} and ${r}/${den}.`,art:vEq(`<em>${w} ${r}/${den}</em>`)},outroSc];break}
  case 'two':{const {a,b,c}=e,t=a*b;sc=[intro(`${a} × ${b}, then ÷ ${c}`,`Two-step story! Split it into two small jobs.`),{cap:`Step 1: how many in total? ${a} × ${b} = ${t}.`,art:vEq(`${a} × ${b} = <em>${t}</em>`)},{cap:`Step 2: share the total. ${t} ÷ ${c} = ${t/c}.`,art:vEq(`${t} ÷ ${c} = <em>${t/c}</em>`)},...divCore(t,c).slice(0,1),checkSc(`${c} × ${t/c} = ${t}`,`Check: ${c} × ${t/c} = ${t}. Correct!`),outroSc];break}
  case 'splitdiv':{const {n,d}=e,q2=n/d,tp=d*10*Math.floor(q2/10),rest=n-tp;sc=[intro(`${n} ÷ ${d} = ?`,`Big number? No problem. Break it into friendly pieces!`),
   {cap:`Split ${n} into a part ${d} divides easily, and the rest.`,art:vEq(`${n} = <em>${tp}</em> + <em>${rest}</em>`)},

   {cap:`Add the pieces: ${tp/d} + ${rest/d} = ${q2}.`,art:vEq(`${tp/d} + ${rest/d} = <em>${q2}</em>`)},checkSc(`${d} × ${q2} = ${n}`,`Check: ${d} × ${q2} = ${n}. Correct!`),outroSc];break}

  case 'frac':{const {num,den,n}=e,q2=n/den;sc=[intro(`${num}/${den} of ${n}`,`Fractions of a number. Two easy steps!`),{cap:`The bottom number, ${den}, says cut ${n} into ${den} equal parts. ${n} ÷ ${den} = ${q2} in each part.`,art:vBar(den,0,q2)},{cap:`The top number, ${num}, says how many parts to take.${num>1?` ${num} × ${q2} = ${num*q2}.`:` So it's ${q2}.`}`,art:vBar(den,num,q2)},{cap:`Pro rule: divide by the bottom, times by the top!`,art:vEq(`${n} ÷ ${den} × ${num} = <em>${num*q2}</em>`)},outroSc];break}

  default:sc=[{cap:`The answer is ${q.ans}. Let's look at it again.`,art:vEq(esc(q.prompt),0,'sm')},outroSc];
 }
 return sc;
}

/* player */
function playVideo(title,scenes,opt={}){
 stopVideo();Object.assign(V,{on:true,scenes,i:0,playing:true,tok:0,onEnd:opt.onEnd,cave:opt.cave});
 const th=$('#th');th.classList.add('on');
 th.innerHTML=`<div class="tbox bevel" role="dialog" aria-label="${esc(title)}"><div class="ttitle"><h3>${esc(title)}</h3><button class="btn sm red" id="vX" aria-label="Close">✕</button></div>
 <div class="screen ${opt.cave?'cave':''}" id="vs"></div><p class="cap bevel" id="vc"></p><div class="vprog" id="vp"></div>
 <div class="tctl"><button class="btn sm" id="vPrev">◀ Back</button><button class="btn sm green" id="vPlay">Pause</button><button class="btn sm" id="vNext">Next ▶</button><button class="btn sm wood" id="vRe">↻ Replay</button><button class="btn sm wood" id="vMute">${S.narrate?'🔊 Voice on':'🔇 Voice off'}</button></div></div>`;
 $('#vX').onclick=closeVideo;$('#vPrev').onclick=()=>showScene(Math.max(0,V.i-1));$('#vNext').onclick=()=>V.i<V.scenes.length-1?showScene(V.i+1):finishVideo();
 $('#vRe').onclick=()=>{V.playing=true;showScene(0)};
 $('#vPlay').onclick=()=>{V.playing=!V.playing;$('#vPlay').textContent=V.playing?'Pause':'Play';if(V.playing)showScene(V.i);else{clearTimeout(V.t);try{speechSynthesis.cancel()}catch(e){}}};
 $('#vMute').onclick=()=>{S.narrate=!S.narrate;save();$('#vMute').textContent=S.narrate?'🔊 Voice on':'🔇 Voice off';if(!S.narrate)try{speechSynthesis.cancel()}catch(e){};if(V.playing)showScene(V.i)};
 showScene(0);
}
function showScene(i){
 if(!V.on)return;V.i=i;const sc=V.scenes[i],my=++V.tok;clearTimeout(V.t);
 $('#vs').innerHTML=`<div class="vin">${sc.art}</div>`;if(sc.geo)drawGeo($('#vs .gv'),sc.geo);fitGeo($('#vs .gv'));$('#vc').textContent=sc.cap.replace(/\{name\}/g,first());
 $('#vp').innerHTML=V.scenes.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
 $('#vPlay').textContent=V.playing?'Pause':'Play';
 if(!V.playing)return;
 const next=()=>{if(my!==V.tok||!V.playing||!V.on)return;if(V.i<V.scenes.length-1)showScene(V.i+1);else finishVideo()};
 const words=sc.cap.split(/\s+/).length,ms=Math.max(3500,words*360+2200);
 if(S.narrate){let ended=false;V.t=setTimeout(next,ms+4000);say(sc.cap.replace(/\{name\}/g,first()),okk=>{if(ended)return;ended=true;clearTimeout(V.t);V.t=setTimeout(next,okk?900:Math.max(800,ms-1500))},sc.lang)}
 else V.t=setTimeout(next,ms);
}
function finishVideo(){V.playing=false;clearTimeout(V.t);$('#vPlay').textContent='Play';
 const b=document.createElement('div');b.className='row';b.innerHTML='<button class="btn green pulse" id="vGot">Got it! ✔</button>';$('#vs').after(b);$('#vGot').onclick=closeVideo}
function stopVideo(){V.on=false;clearTimeout(V.t);try{speechSynthesis.cancel()}catch(e){}$('#th').classList.remove('on');$('#th').innerHTML=''}
function closeVideo(){const cb=V.onEnd;stopVideo();if(cb)cb()}
function playTrick(q,onEnd){playVideo('Trick video',explain(q),{onEnd})}

 });

const crack=(hp,max)=>{const f=1-hp/max;if(f<=0)return '';return `<svg class="crack" viewBox="0 0 8 8"><path d="M1 1 L3 3 L2 5 M4 0 L4 3 L6 5 L5 8 M7 2 L5 3" stroke="#111" stroke-width=".45" fill="none" opacity="${Math.min(1,f+.2)}"/></svg>`};

  if(left<=0){clearInterval(brkTick);const b=$('#brkDone');if(b&&b.disabled){b.disabled=false;b.textContent='I moved! Back to the game';sfx.gem()}}};
 clearInterval(brkTick);brkTick=setInterval(tick,500);tick();
 $('#brkDone').onclick=()=>{if(Date.now()<S.breakUntil)return;S.breakPending=false;S.gems+=15;save();bar();el.classList.remove('on');toast('+15 gems for moving!')};
}
function updBrk(){const left=Math.max(0,S.breakEvery*60-S.playSec);$('#brkLeft').textContent=left>=60?Math.ceil(left/60)+'m':left+'s'}
setInterval(()=>{
 if(document.hidden||S.breakPending||S.pausedAt)return;
 S.playSec++;const lim=S.breakEvery*60;const dd=dayStr();S.sessions[dd]=(S.sessions[dd]||0)+1;
 if(S.playSec===lim-300)toast('5 more minutes, then a movement break!');
 if(S.playSec>=lim){startBreak();return}
 if(S.playSec%15===0)save();
 if(S.playSec%5===0)updBrk();
},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(V.on&&V.playing){V.playing=false;clearTimeout(V.t);try{speechSynthesis.cancel()}catch(e){}const p=$('#vPlay');if(p)p.textContent='Play'}}});
window.addEventListener('pagehide',save);

if('speechSynthesis' in window)try{speechSynthesis.getVoices()}catch(e){}
/* ---------- class accounts (ilk-er.com) ---------- */
let lastSync=0;
async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok){const err=new Error(d.error||('HTTP '+r.status));err.status=r.status;throw err}return d}
function makeSummary(){
 const wk=Date.now()-7*864e5,L=S.log.filter(x=>x.t>wk),days=Object.entries(S.sessions).filter(([d])=>new Date(d)>=new Date(wk-864e5));
 return {stars:totStars(),gems:S.gems,total:S.total,week:L.length,weekRight:L.filter(x=>x.ok).length,streak:S.streak,bosses:Object.keys(S.bosses).length,
  lvl1:lastCheck(1)?avgScore(S.skill,1):null,lvl2:lastCheck(2)?avgScore(S.skill,2):null,rank:rankName(avgScore(S.skill,S.realm),S.realm),realm:S.realm,
  skills:Object.fromEntries([...SK1,...SK2].filter(x=>S.skill[x.id]!=null).map(x=>[x.id,S.skill[x.id]])),subjects:Object.fromEntries(Object.entries(subjectStats()).map(([k,v])=>[k,v.pct])),passed:Object.keys(S.best||{}).filter(k=>S.best[k]*10>=S.passMark).length,weak:weakFacts().slice(0,8),slow:slowFacts().slice(0,8),pace:Object.fromEntries(Object.entries(S.pace||{}).map(([k,v])=>[k,+(median(v)/1000).toFixed(1)])),minutesWeek:Math.round(days.reduce((a,[,v])=>a+v,0)/60)};
}
const slimState=()=>Object.assign({},S,{log:S.log.slice(-800)});
async function syncNow(manual){
 if(!SESSION||!API)return;clearTimeout(syncT);
 if(!dirty&&!manual)return;dirty=false;
 try{const r=await api({action:'save',token:SESSION.token,state:slimState(),summary:makeSummary()});lastSync=r.at||Date.now();if(manual)toast('Saved to ilk-er.com')}
 catch(e){dirty=true;if(e.status===401){toast('Please sign in again');logout(true)}else if(manual)toast('Could not save. Check the internet and try again.')}
}
setInterval(()=>{if(dirty)syncNow()},60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)syncNow()});
async function pullServer(){
 try{const r=await api({action:'load',token:SESSION.token});
  if(r.state&&(r.state.savedAt||0)>(S.savedAt||0)){S=Object.assign(def(),r.state);normalizeS();ensureBase();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(view!=='play'&&view!=='boss')nav(view)}
  else if((S.savedAt||0)>((r.state&&r.state.savedAt)||0)){dirty=true;syncNow()}}
 catch(e){if(e.status===401)logout(true)}
}
async function showBoard(){
 const m=$('#modal');m.innerHTML='<h2>Class leaderboard</h2><p class="note">Loading…</p>';$('#veil').classList.add('on');
 try{await syncNow(false);const r=await api({action:'board',token:SESSION.token});
  m.innerHTML=`<h2>🏆 This week</h2><p class="note">Ranked by right answers in the last 7 days. Stars and bosses show all-time progress.</p>
  <div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th class="n">Right this week</th><th class="n">★</th><th class="n">Bosses</th></tr></thead><tbody>
  ${r.rows.length?r.rows.map((x,i)=>`<tr style="${x.id===r.me?'background:rgba(255,222,59,.45)':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td class="n">${x.weekRight}</td><td class="n">${x.stars}</td><td class="n">${x.bosses}</td></tr>`).join(''):'<tr><td colspan="5">Nobody has played yet. Be the first!</td></tr>'}</tbody></table></div>
  <div class="row"><button class="btn" id="bClose">Close</button></div>`;
  $('#bClose').onclick=closeModal}
 catch(e){m.innerHTML=`<h2>Leaderboard</h2><p>Could not load it right now.</p><div class="row"><button class="btn" id="bClose">Close</button></div>`;$('#bClose').onclick=closeModal}
}
function logout(silent){
 if(!silent&&SESSION&&dirty)syncNow();
 localStorage.removeItem('bmq_session');try{localStorage.removeItem('bmq_offline')}catch(e){}
 SESSION=null;location.reload();
}
const PICS=[['p-flower','Flower','0 0 8 8'],['p-torch','Torch','0 0 8 8'],['p-gem','Gem','0 0 7 7'],['p-pet0','Green pet','0 0 8 8'],['p-pet2','Pink pet','0 0 8 8'],['p-pet3','Sun pet','0 0 8 8'],['p-gear','Gear','0 0 8 8'],['p-piece','Crystal','0 0 8 8'],['i-isword','Sword','0 0 8 8']];
const picSvg=i=>`<svg viewBox="${PICS[i][2]}" aria-hidden="true"><use href="#${PICS[i][0]}" width="${PICS[i][2].split(' ')[2]}" height="${PICS[i][2].split(' ')[3]}"/></svg>`;
const LG={};
function loginShell(inner){$('#login').innerHTML=`<div class="lgin bevel"><svg viewBox="0 0 10 8" style="width:90px;height:72px" aria-hidden="true"><use href="#p-wolf" width="10" height="8"/></svg><h1 style="font-family:Pixel,Lexend,sans-serif;font-size:clamp(30px,6vw,44px)">RAtes Den</h1>${inner}</div>`;$('#login').classList.add('on')}
function showLogin(msg){
 const last=localStorage.getItem('bmq_lastClass')||'';
 loginShell(`<p style="font-weight:700">Type your class code</p><form id="lgF"><input id="lgC" value="${esc(last)}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. 2A-LARA" aria-label="Class code"><button class="btn green">Next</button></form><p class="note" id="lgMsg">${msg||''}</p>
 <p class="note" style="margin-top:22px"><button class="btn sm" id="lgOff">Play on this device only (no class)</button></p>`);
 $('#lgF').onsubmit=async e=>{e.preventDefault();const code=$('#lgC').value.toUpperCase().trim();if(!code)return;$('#lgMsg').textContent='Looking for your class…';
  try{const r=await api({action:'roster',code});LG.code=r.code;LG.cls=r.name;LG.students=r.students;localStorage.setItem('bmq_lastClass',r.code);pickName()}
  catch(err){$('#lgMsg').textContent=err.status===404?'We could not find that class code. Check it with your teacher.':'No connection. Try again in a moment.'}};
 $('#lgOff').onclick=()=>{localStorage.setItem('bmq_offline','1');$('#login').classList.remove('on');boot()};
 setTimeout(()=>{const i=$('#lgC');if(i)i.focus()},50);
}
function pickName(){
 loginShell(`<p style="font-weight:700">${esc(LG.cls)}: who are you?</p><div class="lgnames">${LG.students.map(s=>`<button class="btn wood" data-id="${s.id}"><b>${esc(s.id)}</b> ${esc(s.name)}</button>`).join('')}</div><div class="row"><button class="btn sm" id="lgBack">← Back</button></div>`);
 $('#login').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{LG.id=b.dataset.id;LG.name=LG.students.find(s=>s.id===LG.id).name;let mode='login';try{const r=await api({action:'who',code:LG.code,id:LG.id});if(r.setup)mode='new'}catch(e){}picPad(mode)});
 $('#lgBack').onclick=()=>showLogin();
}
function picPad(mode,firstPick){
 const title=mode==='login'?`Hi ${esc(LG.name)}! Tap your 3 secret pictures.`:mode==='new'?`First time, ${esc(LG.name)}! Choose 3 secret pictures. Remember them in order!`:'Now tap the same 3 pictures again.';
 let picks=[];
 loginShell(`<p style="font-weight:700">${title}</p><div class="lgslots">${[0,1,2].map(i=>`<span id="sl${i}"></span>`).join('')}</div>
 <div class="lgpad">${PICS.map((p,i)=>`<button class="slot" data-p="${i}" aria-label="${p[1]}">${picSvg(i)}<span>${p[1]}</span></button>`).join('')}</div>
 <p class="note" id="lgMsg"></p><div class="row"><button class="btn sm" id="lgClr">Clear</button><button class="btn sm" id="lgBack">← Not ${esc(LG.name)}</button></div>`);
 const paint=()=>[0,1,2].forEach(i=>{$('#sl'+i).innerHTML=picks[i]!=null?(mode==='login'?'●':picSvg(picks[i])):''});
 $('#lgClr').onclick=()=>{picks=[];paint()};$('#lgBack').onclick=pickName;
 $('#login').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
  if(picks.length>=3)return;picks.push(+b.dataset.p);sfx.tap();paint();if(picks.length<3)return;
  if(mode==='new'){setTimeout(()=>picPad('confirm',picks),250);return}
  if(mode==='confirm'&&picks.join()!==firstPick.join()){$('#lgMsg').textContent='Those were different pictures. Let’s choose again.';setTimeout(()=>picPad('new'),1400);return}
  $('#lgMsg').textContent='Checking…';
  try{const r=await api({action:mode==='login'?'login':'setup',code:LG.code,id:LG.id,pics:picks});
   if(r.setup){picPad('new');return}
   loginDone(r)}
  catch(err){picks=[];paint();$('#lgMsg').textContent=err.message==='locked'?'Too many tries. Wait 5 minutes or ask your teacher.':err.message==='wrong'?'Not quite. Try again!':err.status===409?'Your pictures are already set. Tap them to log in.':'No connection. Try again.';if(err.status===409)setTimeout(()=>picPad('login'),1200)}});
}
function loginDone(r){
 SESSION={code:LG.code,id:LG.id,name:r.name,cls:r.className,token:r.token};
 try{sessionStorage.removeItem('rd_greeted')}catch(e){}localStorage.setItem('bmq_session',JSON.stringify(SESSION));KEY=`bmq_${SESSION.code}_${SESSION.id}`;
 let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 const srv=r.state;S=Object.assign(def(),(srv&&(!local||(srv.savedAt||0)>=(local.savedAt||0)))?srv:(local||{}));
 normalizeS();ensureBase();save();$('#login').classList.remove('on');boot();if(!srv){dirty=true;syncNow()}
}
function boot(){normalizeS();ensureBase();bar();renderTabs();view='home';renderHome();if(S.breakPending)showBreak();else if(S.pausedAt)showPause();else greet()}
if(API&&!SESSION&&!localStorage.getItem('bmq_offline'))showLogin();
else{boot();if(SESSION&&API)pullServer()}
}
</script>
</body>
</html>
