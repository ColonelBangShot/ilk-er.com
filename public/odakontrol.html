<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oda Kontrol — TUI BLUE Maviss</title>
<style>
:root{
  --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#2a323e;
  --ink:#eef2f7; --mut:#8a97a8; --acc:#e7b549; --acc2:#c9962a;
  --evet:#2fae6b; --hayir:#e0533d; --yok:#6b7682;
  --evet-bg:#16291f; --hayir-bg:#2c1714; --yok-bg:#1c2129;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{padding-bottom:90px;overscroll-behavior-y:contain}
.serif{font-family:Georgia,'Times New Roman',serif}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#10151c,#0e1116);
  border-bottom:1px solid var(--line);padding:14px 16px 12px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.whobtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;max-width:130px;white-space:nowrap;overflow:hidden}
.whobtn #whoname{text-overflow:ellipsis;overflow:hidden}
.brand h1{font-size:15px;letter-spacing:2px;font-weight:600;text-transform:uppercase}
.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;margin-top:1px}
.statbar{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:700}
.stat span{font-size:10px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.stat.e b{color:var(--evet)} .stat.h b{color:var(--hayir)} .stat.p b{color:var(--acc)}

/* BREADCRUMB */
.crumb{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--mut);font-size:13px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.crumb .back{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600}
.crumb .path{font-weight:600;color:var(--ink)}

/* SEARCH */
.searchwrap{padding:12px 16px 4px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--ink);font-size:15px}
.search::placeholder{color:var(--mut)}

/* LIST */
.list{padding:8px 12px 0}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.row:active{transform:scale(.99)}
.row .lead{flex:1;min-width:0}
.row .name{font-size:16px;font-weight:600}
.row .sub{font-size:12px;color:var(--mut);margin-top:3px}
.row .chev{color:var(--mut);font-size:20px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;margin-left:6px}
.pill.done{background:var(--evet-bg);color:var(--evet)}
.pill.warn{background:var(--hayir-bg);color:var(--hayir)}
.pill.idle{background:var(--yok-bg);color:var(--mut)}
.progress{height:5px;background:var(--panel2);border-radius:6px;margin-top:9px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:6px;transition:width .3s}

/* CHECK ITEMS */
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:9px 0}
.item.answered-hayir{border-color:#5a2a22;background:linear-gradient(180deg,var(--hayir-bg),var(--panel))}
.item.answered-evet{border-color:#234734}
.item .q{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:11px}
.photowarn{display:block;margin-top:6px;font-size:11px;font-weight:600;color:#e0a020;background:rgba(224,160,32,.12);border:1px solid rgba(224,160,32,.3);border-radius:8px;padding:5px 9px}
.item .q .tag{font-size:10px;color:var(--mut);font-weight:600;display:block;margin-bottom:3px;letter-spacing:.5px;text-transform:uppercase}
.choices{display:flex;gap:8px}
.choice{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--mut);
  border-radius:11px;padding:11px 4px;font-size:14px;font-weight:700;letter-spacing:.5px}
.choice:active{transform:scale(.96)}
.choice.sel.evet{background:var(--evet);color:#06140c;border-color:var(--evet)}
.choice.sel.hayir{background:var(--hayir);color:#fff;border-color:var(--hayir)}
.choice.sel.yok{background:var(--yok);color:#fff;border-color:var(--yok)}
.extra{margin-top:11px;display:flex;gap:8px;align-items:flex-start}
.note{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;color:var(--ink);font-size:14px;resize:none;font-family:inherit;min-height:42px}
.note::placeholder{color:var(--mut)}
.photobtn{flex-shrink:0;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--acc);font-size:20px;position:relative;overflow:hidden}
.photobtn input{position:absolute;inset:0;opacity:0}
.photobtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photocount{position:absolute;bottom:2px;right:3px;background:var(--acc);color:#000;font-size:9px;
  font-weight:700;border-radius:8px;padding:0 4px;line-height:13px}
.thumbs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.thumb{width:54px;height:54px;border-radius:9px;border:1px solid var(--line);object-fit:cover;position:relative}
.thumbwrap{position:relative}
.thumbwrap .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--hayir);color:#fff;border:2px solid var(--bg);font-size:11px;line-height:16px}

/* BUTTONS */
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:15px;
  font-weight:700;letter-spacing:.5px}
.btn.gold{background:linear-gradient(90deg,var(--acc2),var(--acc));color:#1a1206}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:scale(.98)}
.addwrap{padding:6px 12px 16px}
.addwrap .btn{margin-top:8px}

/* FAB / BOTTOM BAR */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(14,17,22,0),var(--bg) 30%);}
.bottombar .btn{flex:1}

/* MODAL */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:none;
  align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;
  width:100%;max-width:520px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:12px 14px;color:var(--ink);font-size:15px;font-family:inherit}
.sheet .acts{display:flex;gap:10px;margin-top:6px}
.sheet .acts .btn{flex:1}

/* IMG VIEWER */
.viewer{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);display:none;
  align-items:center;justify-content:center;padding:20px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:88%;border-radius:10px}
.viewer .close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;
  width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px}

.empty{text-align:center;color:var(--mut);padding:50px 20px;font-size:14px;line-height:1.6}
.empty .big{font-size:40px;margin-bottom:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:30px;font-size:13px;
  z-index:300;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.tinybtn{background:none;border:none;color:var(--hayir);font-size:12px;font-weight:600;padding:4px 0}
.muted-line{font-size:11px;color:var(--mut);text-align:center;padding:14px 16px 0}
.voicewrap{padding:12px 16px 4px}
.voicebtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#7a1f1f,#b5342a);color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:15px;font-weight:700;letter-spacing:.3px;box-shadow:0 4px 16px rgba(181,52,42,.35)}
.voicebtn:active{transform:scale(.98)}
.voicebtn.listening{background:linear-gradient(135deg,#b5342a,#e0533d);animation:pulse 1.1s infinite}
.voicebtn .vmic{font-size:20px}
@keyframes pulse{0%,100%{box-shadow:0 4px 16px rgba(224,83,61,.4)}50%{box-shadow:0 4px 30px rgba(224,83,61,.85)}}
.voicehint{font-size:11px;color:var(--mut);text-align:center;margin-top:8px;line-height:1.45;padding:0 8px}
.voiceheard{margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:13px;line-height:1.5}
.voiceheard .vh-title{font-size:10px;color:var(--acc);letter-spacing:.5px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.voiceheard .vh-text{color:var(--ink);font-style:italic}
.voiceheard .vh-result{margin-top:8px;font-size:12px;color:var(--mut)}
.voiceheard .vh-hayir{color:var(--hayir);font-weight:600}
.grouphdr{display:flex;align-items:center;gap:9px;padding:13px 16px 9px;margin-top:6px;
  font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc)}
.grouphdr .gcaret{color:var(--mut);font-size:12px;width:12px}
.grouphdr .gname{flex:0 0 auto}
.grouphdr .gpct{margin-left:auto;color:var(--mut);font-size:12px;font-weight:600;letter-spacing:0}
.groupbody{padding:0 0 2px}
.sub-row{margin-left:8px;margin-right:0}
.loadwrap{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

/* ---------- STORAGE ---------- */
async function load(){
  try{
    const r = await window.storage.get('okdb_v1');
    if(r && r.value){ DB = JSON.parse(r.value); syncFixedItems(); return; }
  }catch(e){}
  // ilk açılış: Elektraweb dökümünden tüm bloklar/katlar kurulur (505 oda)
  DB = { blocks: SEED_ROOMS.map(s => {
    const b = makeBlock(s.block + " · " + s.fname, []);
    b.rooms = s.rooms.map(r => { const rm = makeRoom(r.no); rm.rtype=r.rtype; rm.view=r.view; return rm; });
    return b;
  })};
  await save();
}
function makeBlock(name, roomNos){
  return { id:uid(), name, rooms:(roomNos||[]).map(no=>makeRoom(no)) };
}
function makeRoom(no){
  return { id:uid(), no:String(no), rtype:"", view:"", items:SABIT_MADDELER.map(m=>({
    id:uid(), tag:m.tag, q:m.q, ans:null, note:"", photos:[], fixed:true
  }))};
}
// Mevcut odalarda eksik olan sabit maddeleri tamamla (uygulama güncellenince)
function syncFixedItems(){
  let added=0;
  (DB.blocks||[]).forEach(b=>b.rooms.forEach(r=>{
    const have = new Set(r.items.filter(i=>i.fixed).map(i=>i.q));
    SABIT_MADDELER.forEach(m=>{
      if(!have.has(m.q)){
        r.items.push({id:uid(),tag:m.tag,q:m.q,ans:null,note:"",photos:[],fixed:true});
        added++;
      }
    });
  }));
  if(added) save();
}
let saveTimer=null;
async function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await window.storage.set('okdb_v1', JSON.stringify(DB)); }
    catch(e){ toast("Kayıt hatası — foto çok büyük olabilir"); }
  },250);
}

/* ---------- HELPERS ---------- */
function curBlock(){ return DB.blocks.find(b=>b.id===view.blockId); }
function curRoom(){ const b=curBlock(); return b && b.rooms.find(r=>r.id===view.roomId); }
function roomStats(r){
  const ans=r.items.filter(i=>i.ans!==null).length;
  const hayir=r.items.filter(i=>i.ans==='hayir').length;
  return {ans, total:r.items.length, hayir, pct:r.items.length?Math.round(ans/r.items.length*100):0};
}
function blockStats(b){
  let evet=0,hayir=0,ans=0,total=0;
  b.rooms.forEach(r=>r.items.forEach(i=>{total++;if(i.ans){ans++};if(i.ans==='evet')evet++;if(i.ans==='hayir')hayir++;}));
  return {evet,hayir,ans,total,rooms:b.rooms.length};
}
function allStats(){
  let evet=0,hayir=0,ans=0,total=0,rooms=0;
  DB.blocks.forEach(b=>{rooms+=b.rooms.length;b.rooms.forEach(r=>r.items.forEach(i=>{
    total++;if(i.ans){ans++};if(i.ans==='evet')evet++;if(i.ans==='hayir')hayir++;}))});
  return {evet,hayir,ans,total,rooms};
}

function render(){
  const wn=document.getElementById('whoname'); if(wn) wn.textContent = HAZIRLAYAN || 'İsim?';
  if(view.screen==='blocks') renderBlocks();
  else if(view.screen==='rooms') renderRooms();
  else if(view.screen==='room') renderRoom();
  renderStatbar();
  renderBottom();
}
function renderStatbar(){
  const s = view.screen==='blocks' ? allStats()
          : view.screen==='rooms' ? blockStats(curBlock())
          : (()=>{const r=curRoom();return r?{evet:r.items.filter(i=>i.ans==='evet').length,
              hayir:r.items.filter(i=>i.ans==='hayir').length,ans:roomStats(r).ans,total:r.items.length}:{}})();
  $('#statbar').innerHTML = `
    <div class="stat e"><b>${s.evet||0}</b><span>Evet</span></div>
    <div class="stat h"><b>${s.hayir||0}</b><span>Hayır</span></div>
    <div class="stat p"><b>${s.ans||0}/${s.total||0}</b><span>Cevaplanan</span></div>`;
}

let openGroups = {};
function blockGroupKey(b){ const m=b.name.match(/^([A-Za-z])\s*Blok/i); return m?('grp_'+m[1].toUpperCase()):'grp_diger'; }
function blockGroupLabel(k){ return k==='grp_diger' ? 'Diğer' : (k.replace('grp_','')+' Blok'); }
function renderBlocks(){
  $('#hsub').textContent = "TUI BLUE Maviss · Pre-Opening Denetim";
  let html = `<div class="searchwrap"><input class="search" id="q" placeholder="🔎 Blok / kat / oda ara…" oninput="filterBlocks(this.value)"></div><div class="list" id="blist">`;
  // grupla
  const groups={};
  DB.blocks.forEach(b=>{ const k=blockGroupKey(b); (groups[k]=groups[k]||[]).push(b); });
  Object.keys(groups).sort().forEach(gk=>{
    const blks=groups[gk];
    let ge=0,gh=0,ga=0,gt=0,gr=0;
    blks.forEach(b=>{const s=blockStats(b);ge+=s.evet;gh+=s.hayir;ga+=s.ans;gt+=s.total;gr+=s.rooms;});
    const gpct=gt?Math.round(ga/gt*100):0;
    const open = openGroups[gk]!==false; // default açık
    const gpill = gh?`<span class="pill warn">${gh} Hayır</span>`:`<span class="pill idle">${gr} oda</span>`;
    html += `<div class="grouphdr" onclick="toggleGroup('${gk}')" data-gname="${blockGroupLabel(gk).toLowerCase()}">
        <span class="gcaret">${open?'▾':'▸'}</span>
        <span class="gname">${esc(blockGroupLabel(gk))}</span> ${gpill}
        <span class="gpct">${gpct}%</span></div>`;
    html += `<div class="groupbody" data-gk="${gk}" style="display:${open?'block':'none'}">`;
    html += blks.map(b=>{
      const st=blockStats(b);
      const pct = st.total?Math.round(st.ans/st.total*100):0;
      const pill = st.total&&st.ans===st.total ? `<span class="pill done">✓</span>`
                 : st.hayir ? `<span class="pill warn">${st.hayir}</span>`
                 : `<span class="pill idle">${st.rooms}</span>`;
      // kat adını göster (blok harfini at)
      const short = b.name.replace(/^[A-Za-z]\s*Blok\s*·?\s*/i,'');
      return `<div class="row sub-row" data-name="${b.name.toLowerCase()}" onclick="openBlock('${b.id}')">
        <div class="lead">
          <div class="name">${esc(short||b.name)} ${pill}</div>
          <div class="sub">${st.rooms} oda · ${st.ans}/${st.total} madde</div>
          <div class="progress"><i style="width:${pct}%"></i></div>
        </div><div class="chev">›</div></div>`;
    }).join('');
    html += `</div>`;
  });
  html += `</div><div class="addwrap"><button class="btn ghost" onclick="addBlockModal()">+ Yeni Blok / Kat Ekle</button></div>`;
  $('#app').innerHTML = html;
}
function toggleGroup(gk){ openGroups[gk]=openGroups[gk]===false?true:false; renderBlocks(); }
function filterBlocks(v){
  v=v.toLowerCase().trim();
  document.querySelectorAll('.groupbody').forEach(g=>g.style.display='block');
  document.querySelectorAll('.gcaret').forEach(c=>c.textContent='▾');
  document.querySelectorAll('#blist .row').forEach(r=>{
    r.style.display=(!v||r.dataset.name.includes(v))?'':'none';});
  // boş grupları gizle
  document.querySelectorAll('.groupbody').forEach(g=>{
    const vis=[...g.querySelectorAll('.row')].some(r=>r.style.display!=='none');
    g.style.display=vis?'block':'none';
    g.previousElementSibling.style.display=(!v||vis)?'':'none';
  });
}

    const needPhoto = it.ans==='hayir' && it.photos.length===0;
    return `<div class="item ${cls}" id="it_${it.id}">
      <div class="q"><span class="tag">${esc(it.tag||'Genel')}</span>${esc(it.q)}
        ${!it.fixed?`<button class="tinybtn" style="float:right" onclick="delItem('${it.id}')">sil</button>`:''}
        ${needPhoto?`<div class="photowarn">📷 Bu eksik için fotoğraf gerekli</div>`:''}</div>
      <div class="choices">
        <button class="choice evet ${it.ans==='evet'?'sel':''}" onclick="setAns('${it.id}','evet')">EVET</button>
        <button class="choice hayir ${it.ans==='hayir'?'sel':''}" onclick="setAns('${it.id}','hayir')">HAYIR</button>
        <button class="choice yok ${it.ans==='yok'?'sel':''}" onclick="setAns('${it.id}','yok')">YOK</button>
      </div>
      <div class="extra">
        <textarea class="note" placeholder="Not (örn: kumanda yok, WC'de yok…)" oninput="setNote('${it.id}',this.value)">${esc(it.note)}</textarea>
        <label class="photobtn">📷
          ${it.photos.length?`<span class="photocount">${it.photos.length}</span>`:''}

        </label>
      </div>
      ${thumbs?`<div class="thumbs">${thumbs}</div>`:''}

  }).join('');
  html += `</div><div class="addwrap"><button class="btn ghost" onclick="addItemModal()">+ Kontrol Maddesi Ekle</button>
    <button class="tinybtn" style="display:block;margin:10px auto 0" onclick="delRoom()">Bu odayı sil</button></div>`;
  $('#app').innerHTML = html;
}

function setAns(itemId,val){

  save();

function setNote(itemId,val){const it=curRoom().items.find(i=>i.id===itemId);it.note=val;save();}

function addPhoto(itemId,input){
  const f=input.files[0]; if(!f)return;
  const it=curRoom().items.find(i=>i.id===itemId);
  const reader=new FileReader();
  reader.onload=e=>{
    compress(e.target.result, 1000, 0.6, dataUrl=>{
      it.photos.push(dataUrl); save(); renderRoom();
      toast("Fotoğraf eklendi");
    });
  };
  reader.readAsDataURL(f);
  input.value='';
}
function compress(src,maxW,q,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxW){h=h*maxW/w;w=maxW;}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',q));
  };
  img.src=src;
}
function delPhoto(itemId,pi){
  const it=curRoom().items.find(i=>i.id===itemId);
  it.photos.splice(pi,1);save();renderRoom();
}

function genTxt(blocks, mode){

async function genPdf(blocks, mode, withPhotos){
  toast("PDF hazırlanıyor…");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const W=210, H=297, M=14;
  let y=0;
  const GOLD=[201,150,42], DARK=[30,38,48], RED=[200,60,45], GREEN=[40,150,90], GREY=[120,130,145];

  // sadeleştirilmiş Türkçe (font gömmeden güvenli olsun diye TR karakterleri koruyup core font kullanıyoruz;
  // jsPDF default WinAnsi'de ç/ş/ğ kısmen sorunlu olabilir -> latinize fallback)
  function tr(s){ s=String(s==null?'':s);
    const map={'\u00e7':'c','\u00c7':'C','\u011f':'g','\u011e':'G','\u0131':'i','\u0130':'I','\u00f6':'o','\u00d6':'O','\u015f':'s','\u015e':'S','\u00fc':'u','\u00dc':'U','\u00e2':'a','\u00ee':'i','\u00fb':'u'};
    return s.replace(/[\u00e7\u00c7\u011f\u011e\u0131\u0130\u00f6\u00d6\u015f\u015e\u00fc\u00dc\u00e2\u00ee\u00fb]/g,c=>map[c]||c);
  }

  // ---- KAPAK ----
  doc.setFillColor(...DARK); doc.rect(0,0,W,52,'F');
  doc.setFillColor(...GOLD); doc.rect(0,52,W,2,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.text("TUI BLUE MAVISS", M, 26);
  doc.setFontSize(13); doc.setFont('helvetica','normal'); doc.setTextColor(...GOLD);
  doc.text("Oda Kontrol Raporu — Pre-Opening Denetim", M, 36);
  const dev=detectDevice();
  doc.setFontSize(9); doc.setTextColor(210,210,210);
  doc.text("Tarih: "+new Date().toLocaleString('tr-TR'), M, 44);
  doc.text("Hazirlayan: "+tr(HAZIRLAYAN||'(belirtilmedi)'), M, 49);
  doc.setFontSize(7.5); doc.setTextColor(170,170,170);
  doc.text("Cihaz: "+tr(dev.os)+" · "+tr(dev.br), M, 53.5);

  // ---- GENEL ÖZET ----
  let tot={evet:0,hayir:0,ans:0,total:0,rooms:0};
  blocks.forEach(b=>{const s=blockStats(b);tot.evet+=s.evet;tot.hayir+=s.hayir;tot.ans+=s.ans;tot.total+=s.total;tot.rooms+=s.rooms;});
  // fotoğrafsız HAYIR sayısı
  let noPhoto=0;
  blocks.forEach(b=>b.rooms.forEach(r=>r.items.forEach(i=>{ if(i.ans==='hayir'&&i.photos.length===0) noPhoto++; })));
  y=66;
  doc.setTextColor(...DARK); doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text("Genel Ozet", M, y); y+=3;
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.5); doc.line(M,y,W-M,y); y+=8;
  // KPI kutuları
  const kpis=[["Oda",tot.rooms],["Cevaplanan",tot.ans+"/"+tot.total],["EVET",tot.evet],["HAYIR",tot.hayir]];
  const bw=(W-2*M-9)/4;
  kpis.forEach((k,i)=>{
    const x=M+i*(bw+3);
    doc.setFillColor(245,246,248); doc.roundedRect(x,y,bw,18,2,2,'F');
    doc.setFontSize(15); doc.setFont('helvetica','bold');
    doc.setTextColor(...(k[0]==='HAYIR'?RED:k[0]==='EVET'?GREEN:DARK));
    doc.text(String(k[1]), x+bw/2, y+9, {align:'center'});
    doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(...GREY);
    doc.text(k[0], x+bw/2, y+14, {align:'center'});
  });
  y+=26;
  // fotoğraf eksik uyarı bandı
  if(noPhoto>0){
    doc.setFillColor(255,243,224); doc.roundedRect(M,y,W-2*M,9,1.5,1.5,'F');
    doc.setTextColor(180,90,20); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text("! "+noPhoto+" adet eksik (HAYIR) henuz fotograflanmamis.", M+3, y+6);
    y+=14;
  }

  // ---- BLOK BLOK ----
  const ensure=(need)=>{ if(y+need>H-16){ doc.addPage(); y=18; } };
  for(const b of blocks){
    const bs=blockStats(b);
    const roomsWithData = b.rooms.filter(r=>{
      const it = mode==='full'?r.items.filter(i=>i.ans):r.items.filter(i=>i.ans==='hayir');
      return it.length>0;
    });
    if(mode==='issues' && bs.hayir===0) continue; // eksiksiz bloğu atla
    ensure(20);
    // blok başlığı
    doc.setFillColor(...DARK); doc.roundedRect(M,y,W-2*M,9,1.5,1.5,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
    doc.text(tr(b.name), M+3, y+6);
    doc.setTextColor(...GOLD); doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    doc.text(bs.rooms+" oda · "+bs.hayir+" HAYIR · "+(bs.total?Math.round(bs.ans/bs.total*100):0)+"%", W-M-3, y+6, {align:'right'});
    y+=13;

    for(const r of b.rooms){
      const items = mode==='full'?r.items.filter(i=>i.ans):r.items.filter(i=>i.ans==='hayir');
      if(!items.length) continue;
      const st=roomStats(r);
      ensure(8+items.length*5.5 + (withPhotos? items.reduce((a,i)=>a+(i.photos.length?20:0),0):0));
      // oda satırı
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...DARK);
      doc.text("Oda "+tr(r.no)+(r.rtype?"  ·  "+tr(r.rtype):""), M+2, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GREY);
      doc.text(st.hayir+" Hayir / "+st.ans+" cevapli", W-M-2, y, {align:'right'});
      y+=2; doc.setDrawColor(225,228,233); doc.setLineWidth(0.2); doc.line(M+2,y,W-M-2,y); y+=4;
      // maddeler
      for(const i of items){
        const mark = i.ans==='hayir'?'[X]':i.ans==='evet'?'[OK]':'[--]';
        doc.setTextColor(...(i.ans==='hayir'?RED:i.ans==='evet'?GREEN:GREY));
        doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
        doc.text(mark, M+3, y);
        doc.setTextColor(50,55,65); doc.setFont('helvetica','normal');
        let line = tr(i.q);
        const txt = doc.splitTextToSize(line, W-2*M-22);
        doc.text(txt, M+13, y);
        let used = txt.length*4.2;
        if(i.note){
          doc.setTextColor(...GREY); doc.setFont('helvetica','italic'); doc.setFontSize(7.8);
          const nt = doc.splitTextToSize("Not: "+tr(i.note), W-2*M-22);
          doc.text(nt, M+13, y+used);
          used += nt.length*3.8;
        }
        // Fotoğraf eksik uyarısı (sadece HAYIR maddeler için)
        if(i.ans==='hayir' && i.photos.length===0){
          doc.setTextColor(...RED); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
          doc.text("[ ! FOTOGRAF EKSIK ]", M+13, y+used);
          used += 4;
        }
        y += Math.max(5.5, used+1);
        // fotoğraflar
        if(withPhotos && i.photos.length){
          ensure(22);
          let px=M+13;
          for(const p of i.photos.slice(0,4)){
            try{ doc.addImage(p,'JPEG',px,y,18,18); }catch(e){}
            px+=20;
          }
          y+=21;
        }
      }
      y+=3;
    }
    y+=3;
  }

  // ---- FOOTER (tüm sayfalar) ----
  const pages=doc.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setDrawColor(...GOLD); doc.setLineWidth(0.4); doc.line(M,H-12,W-M,H-12);
    doc.setFontSize(7.5); doc.setTextColor(...GREY); doc.setFont('helvetica','normal');
    doc.text("TUI BLUE Maviss · Bogazkent, Serik/Antalya", M, H-7);
    doc.text("Sayfa "+p+" / "+pages, W-M, H-7, {align:'right'});
  }

  const dt=new Date().toISOString().slice(0,10);
  doc.save("TUI-Blue-Maviss-Oda-Kontrol-"+dt+".pdf");
  toast("PDF indirildi ✓");
}

/* ---------- SESLİ GİRİŞ ---------- */
let recog=null, listening=false, voiceRoomId=null;
function toggleVoice(roomId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Bu tarayıcı sesli girişi desteklemiyor (Safari/Chrome dene)"); return; }
  if(listening){ stopVoice(); return; }
  voiceRoomId=roomId;
  recog = new SR();
  recog.lang='tr-TR'; recog.continuous=true; recog.interimResults=true;
  let finalText="";
  const btn=$('#voicebtn'), heard=$('#voiceheard');
  recog.onstart=()=>{ listening=true; btn.classList.add('listening');
    btn.querySelector('.vlabel').textContent="Dinleniyor… bitince tekrar bas"; };
  recog.onerror=(e)=>{ toast("Ses hatası: "+(e.error||'')); stopVoice(); };
  recog.onresult=(e)=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText+=" "+t; else interim+=t;
    }
    heard.style.display='block';
    heard.innerHTML=`<div class="vh-title">Duyulan</div><div class="vh-text">"${esc((finalText+" "+interim).trim())}"</div>`;
  };
  recog.onend=()=>{ if(listening){ applyVoice(finalText); stopVoice(); } };
  try{ recog.start(); }catch(e){ toast("Mikrofon başlatılamadı"); }
}
function stopVoice(){
  listening=false;
  if(recog){ try{recog.stop();}catch(e){} }
  const btn=$('#voicebtn');
  if(btn){ btn.classList.remove('listening');
    btn.querySelector('.vlabel').textContent="Sesli Kontrol — eksikleri say"; }
}
function normTr(s){ return String(s||'').toLowerCase()
  .replace(/İ/g,'i').replace(/I/g,'ı')
  .replace(/[.,;:!?]/g,' ').replace(/\s+/g,' ').trim(); }
function applyVoice(text){
  const r = curRoom(); if(!r){ return; }
  const t = normTr(text);
  if(!t){ toast("Ses algılanmadı"); return; }
  let hayirCount=0; const hitNames=[];
  // her sabit maddeyi kontrol et
  r.items.filter(i=>i.fixed).forEach(it=>{
    const kws = MADDE_KW[it.q]||[];
    const hit = kws.some(k=>t.includes(normTr(k)));
    if(hit){
      it.ans='hayir'; hayirCount++;
      // ham metni not olarak ekle (zaten not varsa üzerine yazma, ekle)
      const tag = "[sesli] "+text.trim();
      it.note = it.note ? (it.note+" · "+tag) : tag;
      hitNames.push(it.q);
    } else {
      // söylenmeyen sabit madde = EVET (sadece henüz cevaplanmamışsa dokun, elle HAYIR demişsen bozma? -> en hızlı mod: hepsini EVET yap)
      it.ans='evet';
    }
  });
  save();
  renderRoom();
  // sonuç özetini göster
  const heard=$('#voiceheard');
  if(heard){
    heard.style.display='block';
    let html=`<div class="vh-title">Sonuç</div><div class="vh-text">"${esc(text.trim())}"</div>`;
    if(hayirCount){
      html+=`<div class="vh-result"><span class="vh-hayir">${hayirCount} eksik (HAYIR)</span> işaretlendi, kalan maddeler EVET yapıldı:</div>`;
      html+=`<div class="vh-result">✗ ${hitNames.map(esc).join('<br>✗ ')}</div>`;
      html+=`<div class="vh-result" style="color:var(--acc);font-weight:600;margin-top:8px">📷 Bu eksikleri aşağıdan fotoğraflamayı unutma — fotoğrafsız eksikler raporda "FOTOĞRAF EKSİK" damgalanır.</div>`;
    } else {
      html+=`<div class="vh-result">Eksik algılanmadı — tüm maddeler EVET yapıldı. (Yanlışsa elle düzelt)</div>`;
    }
    heard.innerHTML=html;
  }
  toast(hayirCount?(hayirCount+" eksik işaretlendi, kalan EVET"):"Tümü EVET yapıldı");
  renderStatbar();
}

/* ---------- UTIL ---------- */
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- HAZIRLAYAN & CİHAZ ---------- */
function detectDevice(){
  const ua=navigator.userAgent;
  let os="Bilinmeyen";
  if(/Windows NT 10/.test(ua))os="Windows 10/11";
  else if(/Windows/.test(ua))os="Windows";
  else if(/iPhone|iPad|iPod/.test(ua))os="iOS (iPhone/iPad)";
  else if(/Android/.test(ua)){const m=ua.match(/Android\s([\d.]+)/);os="Android"+(m?" "+m[1]:"");}
  else if(/Mac OS X/.test(ua))os="macOS";
  else if(/Linux/.test(ua))os="Linux";
  let br="Tarayıcı";
  if(/Edg\//.test(ua))br="Edge"; else if(/SamsungBrowser/.test(ua))br="Samsung Internet";
  else if(/Chrome\//.test(ua))br="Chrome"; else if(/Firefox/.test(ua))br="Firefox";
  else if(/Safari/.test(ua))br="Safari";
  return {os, br, ua};
}
let HAZIRLAYAN = "";
async function loadIdentity(){
  try{ const r=await window.storage.get('ok_hazirlayan'); if(r&&r.value) HAZIRLAYAN=r.value; }catch(e){}
}
async function setIdentity(name){
  HAZIRLAYAN=(name||'').trim();
  try{ await window.storage.set('ok_hazirlayan', HAZIRLAYAN); }catch(e){}
}
function askIdentity(force){
  if(HAZIRLAYAN && !force){ return; }
  openSheet(`<h3>Hazırlayan</h3>
    <div class="field"><label>Adınız Soyadınız</label>
      <input id="hzn" placeholder="örn: İlker Dege" value="${esc(HAZIRLAYAN)}"></div>
    <div class="muted-line" style="text-align:left;padding:0 0 6px">Bu isim raporlara otomatik yazılır. İstediğinde üstteki isme dokunup değiştirebilirsin.</div>
    <div class="acts"><button class="btn gold" onclick="saveIdentity()">Kaydet</button></div>`);
}
async function saveIdentity(){
  const v=($('#hzn')||{}).value||'';
  if(!v.trim()){ toast("Lütfen adınızı girin"); return; }
  await setIdentity(v); closeSheet(); render(); toast("Kaydedildi: "+HAZIRLAYAN);
}

/* ---------- INIT ---------- */
(async()=>{ await loadIdentity(); await load(); render(); if(!HAZIRLAYAN) setTimeout(()=>askIdentity(false),400); })();
</script>
